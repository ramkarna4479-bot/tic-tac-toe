<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Tic Tac Toe</h1>

        <p class="subtitle">Player O vs Player X</p>

        <div class="container">

            <div class="game">

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

            </div>

        </div>

        <div class="message">
            <p id="status">Player O's Turn</p>
        </div>

        <div class="reset">
            <button class="again">RESET THE GAME</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
